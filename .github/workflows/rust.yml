name: Rust CI Pipeline

permissions:
  contents: read

on:
  push:
    branches:
  pull_request:
    branches:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check formatting
        run: cargo fmt -- --check
      - name: Run clippy
        run: cargo clippy
      - name: Run tests (default features)
        run: RUST_BACKTRACE=full cargo test --verbose
      - name: Run tests (with git)
        run: RUST_BACKTRACE=full cargo test --features git --verbose
